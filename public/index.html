<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>局域网文件分享</title>
  <!-- 设计系统：令牌与组件（Kesonoasis） + 应用样式 -->
  <link rel="stylesheet" href="css/colors_and_type.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/app.css">
  <!-- 提前应用主题，避免闪烁 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app">

    <!-- 顶部导航条 -->
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <svg class="brand-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
          <div class="brand-text">
            <h1 class="brand-title">局域网文件分享</h1>
            <p class="brand-subtitle">快速、便捷的文件共享服务</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-secondary btn-sm" id="switch-folder-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            切换文件夹
          </button>
          <button class="btn btn-ghost btn-sm theme-toggle" id="theme-toggle" aria-pressed="false" title="主题切换">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            主题切换
          </button>
        </div>
      </div>
    </header>

    <!-- 工具栏 -->
    <div class="toolbar">
      <div class="toolbar-info">
        <span class="current-folder-name" id="current-folder-name">未选择</span>
        <span class="folder-description" id="folder-description-text"></span>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" class="input input--search" id="file-search" placeholder="搜索文档" aria-label="搜索文档">
      </div>
    </div>

    <!-- 面包屑 -->
    <nav class="breadcrumb" id="breadcrumb"></nav>

    <!-- 文件面板 -->
    <main class="file-panel">
      <div class="file-header">
        <span class="col-name">名称</span>
        <span class="col-size">大小</span>
        <span class="col-modified">修改时间</span>
        <span class="col-actions">操作</span>
      </div>
      <div class="file-list" id="file-list">
        <div class="loading">加载中…</div>
      </div>
    </main>

    <!-- 页脚版权 -->
    <footer class="app-footer">
      <span>© 2026 kesonoasis</span>
      <span class="app-footer-sep">·</span>
      <span>仅供局域网内文件共享使用</span>
      <span class="app-footer-sep">·</span>
      <a class="app-footer-link" href="https://github.com/heikeson/LAN-File-Share" target="_blank" rel="noopener noreferrer">GitHub 仓库</a>
    </footer>
  </div>

  <!-- 切换文件夹模态框 -->
  <div class="modal-backdrop" id="folder-modal">
    <div class="modal modal-md" role="dialog" aria-modal="true" aria-labelledby="folder-modal-title">
      <div class="modal-header">
        <span class="modal-title" id="folder-modal-title">选择分享文件夹</span>
        <button class="modal-close" id="folder-modal-close" aria-label="关闭">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="folder-modal-body"></div>
    </div>
  </div>

  <!-- 文件预览模态框 -->
  <div class="modal-backdrop" id="preview-modal">
    <div class="modal modal-lg preview-modal" role="dialog" aria-modal="true" aria-labelledby="preview-modal-title">
      <div class="modal-header">
        <span class="modal-title" id="preview-modal-title">文件预览</span>
        <button class="btn btn-ghost btn-sm preview-md-toggle" id="preview-md-toggle" style="display:none">查看源码</button>
        <button class="modal-close" id="preview-modal-close" aria-label="关闭">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body preview-body" id="preview-body"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost btn-sm" id="preview-open-new">新标签打开</button>
        <button class="btn btn-primary btn-sm" id="preview-download">下载</button>
      </div>
    </div>
  </div>

  <!-- 提示条 -->
  <div class="toast" id="toast"></div>

  <!-- Markdown 渲染：markdown-it 解析 + DOMPurify 防 XSS（均为浏览器 UMD 构建，离线可用） -->
  <script src="vendor/markdown-it.min.js"></script>
  <script src="vendor/purify.min.js"></script>

  <script>
    // ── 状态 ────────────────────────────────────────────────
    let currentFolderIndex = 0;
    let currentPath = '';
    let currentData = null;
    let searchQuery = '';

    // ── 图标 ────────────────────────────────────────────────
    const SVGIcons = {
      folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>',
      back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>',
      image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>',
      video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>',
      audio: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
      pdf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
      archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>',
      doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>',
      code: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>',
      file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>'
    };

    function getFileIcon(file) {
      const ct = (file.type || '').toLowerCase();
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      if (ct.startsWith('image/')) return SVGIcons.image;
      if (ct.startsWith('video/')) return SVGIcons.video;
      if (ct.startsWith('audio/')) return SVGIcons.audio;
      if (ct === 'application/pdf' || ext === 'pdf') return SVGIcons.pdf;
      if (['zip', 'rar', '7z', 'tar', 'gz', 'bz2'].includes(ext)) return SVGIcons.archive;
      if (['doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'txt', 'md', 'rtf'].includes(ext)) return SVGIcons.doc;
      if (['js', 'ts', 'json', 'html', 'css', 'py', 'java', 'c', 'cpp', 'go', 'sh', 'xml', 'yml', 'yaml', 'sql'].includes(ext)) return SVGIcons.code;
      return SVGIcons.file;
    }

    // 文件类型 → 标签文案与语义色（使用设计系统已有 tag 变体）
    function getTypeTag(file) {
      const ct = (file.type || '').toLowerCase();
      const ext = (file.name.split('.').pop() || '').toLowerCase();
      if (ct.startsWith('image/')) return { label: '图片', cls: 'tag-info' };
      if (ct.startsWith('video/')) return { label: '视频', cls: 'tag-primary' };
      if (ct.startsWith('audio/')) return { label: '音频', cls: 'tag-warning' };
      if (ct === 'application/pdf' || ext === 'pdf') return { label: 'PDF', cls: 'tag-error' };
      if (['zip', 'rar', '7z', 'tar', 'gz', 'bz2'].includes(ext)) return { label: '压缩包', cls: 'tag-success' };
      if (['doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'txt', 'md', 'rtf'].includes(ext)) return { label: '文档', cls: 'tag-warning' };
      if (['js', 'ts', 'json', 'html', 'css', 'py', 'java', 'c', 'cpp', 'go', 'sh', 'xml', 'yml', 'yaml', 'sql'].includes(ext)) return { label: '代码', cls: 'tag-info' };
      return { label: '文件', cls: 'tag-primary' };
    }

    function escapeHtml(text) {
      return String(text == null ? '' : text)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ── 文件夹 ──────────────────────────────────────────────
    async function loadFolders() {
      const modalBody = document.getElementById('folder-modal-body');
      try {
        const response = await fetch('/api/folders');
        const data = await response.json();
        const folders = Array.isArray(data) ? data : (data.folders || []);
        if (!folders.length) {
          modalBody.innerHTML = '<div class="empty">暂无可用文件夹</div>';
          return;
        }
        modalBody.innerHTML = folders.map((folder, i) => `
          <div class="folder-option ${i === currentFolderIndex ? 'active' : ''}" data-index="${i}">
            <div class="folder-option-name">${escapeHtml(folder.name)}</div>
            <div class="folder-option-desc">${escapeHtml(folder.description || '')}</div>
          </div>
        `).join('');
        modalBody.querySelectorAll('.folder-option').forEach(el => {
          el.addEventListener('click', () => {
            const idx = parseInt(el.getAttribute('data-index'), 10);
            if (idx !== currentFolderIndex || currentPath !== '') selectFolder(idx);
            else closeFolderModalBtn();
          });
        });
      } catch (error) {
        modalBody.innerHTML = '<div class="error">文件夹加载失败</div>';
      }
    }

    function selectFolder(index) {
      currentFolderIndex = index;
      document.querySelectorAll('.folder-option').forEach(el => {
        el.classList.toggle('active', parseInt(el.getAttribute('data-index'), 10) === index);
      });
      closeFolderModalBtn();
      loadFiles(index, '');
    }

    function openFolderModal() { document.getElementById('folder-modal').classList.add('active'); }
    function closeFolderModalBtn() { document.getElementById('folder-modal').classList.remove('active'); }
    function closeFolderModal(event) {
      if (event.target.id === 'folder-modal') closeFolderModalBtn();
    }

    // ── 文件预览 ──────────────────────────────────────────────
    const TEXT_EXT = /\.(txt|md|markdown|json|js|ts|jsx|tsx|css|html?|xml|log|csv|ini|yml|yaml|py|java|c|cpp|h|hpp|sh|bat|cmd|sql|go|rs|php|rb)$/i;

    // 将字节解码为文本：优先 UTF-8，若含大量替换符则回退 GBK，解决中文 txt 乱码；并去除 UTF-8 BOM
    function decodeText(bytes) {
      const utf8 = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
      const replaced = utf8.split('\uFFFD').length - 1;
      let text = utf8;
      if (replaced > 0 && replaced * 20 > utf8.length) {
        try { text = new TextDecoder('gbk').decode(bytes); } catch (e) {}
      }
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
      return text;
    }

    // 判断文件是否支持在线预览（图片/视频/音频/PDF/文本）
    function canPreview(type, fileName) {
      const ct = (type || '').toLowerCase();
      return ct.startsWith('image/') || ct.startsWith('video/') || ct.startsWith('audio/')
        || ct === 'application/pdf' || ct.startsWith('text/')
        || TEXT_EXT.test(fileName || '');
    }

    function openPreview(folderIndex, urlPath, type) {
      const previewUrl = `/p/${folderIndex}/${urlPath}`;
      const downloadUrl = `/d/${folderIndex}/${urlPath}`;
      const fileName = decodeURIComponent(urlPath.split('/').pop()) || '文件';
      const bodyEl = document.getElementById('preview-body');
      document.getElementById('preview-modal-title').textContent = fileName;
      document.getElementById('preview-download').onclick = () => window.open(downloadUrl);
      document.getElementById('preview-open-new').onclick = () => window.open(previewUrl);

      const ct = (type || '').toLowerCase();
      const isImage = ct.startsWith('image/');
      const isVideo = ct.startsWith('video/');
      const isAudio = ct.startsWith('audio/');
      const isPdf = ct === 'application/pdf';
      const isText = ct.startsWith('text/') || TEXT_EXT.test(fileName);
      const isMarkdown = /\.(md|markdown)$/i.test(fileName) || ct === 'text/markdown';

      bodyEl.innerHTML = '';
      bodyEl.classList.remove('is-md');
      document.getElementById('preview-md-toggle').style.display = isMarkdown ? '' : 'none';
      if (isImage) {
        const img = document.createElement('img');
        img.className = 'preview-media';
        img.src = previewUrl;
        img.alt = fileName;
        bodyEl.appendChild(img);
      } else if (isVideo) {
        const v = document.createElement('video');
        v.className = 'preview-media';
        v.src = previewUrl;
        v.controls = true;
        bodyEl.appendChild(v);
      } else if (isAudio) {
        const a = document.createElement('audio');
        a.className = 'preview-media';
        a.src = previewUrl;
        a.controls = true;
        bodyEl.appendChild(a);
      } else if (isPdf) {
        const f = document.createElement('iframe');
        f.className = 'preview-frame';
        f.src = previewUrl;
        bodyEl.appendChild(f);
      } else if (isText) {
        bodyEl.innerHTML = '<div class="preview-loading">正在加载文本…</div>';
        fetch(previewUrl).then(r => {
          if (!r.ok) throw new Error('load');
          return r.arrayBuffer();
        }).then(buf => {
          const text = decodeText(new Uint8Array(buf));
          if (isMarkdown) renderMarkdown(text, 'render');
          else {
            const pre = document.createElement('pre');
            pre.className = 'preview-text';
            pre.textContent = text.length > 200000
              ? text.slice(0, 200000) + '\n\n…（内容过大，仅显示前 200000 字符）'
              : text;
            bodyEl.innerHTML = '';
            bodyEl.appendChild(pre);
          }
        }).catch(() => {
          bodyEl.innerHTML = '<div class="preview-unsupported">文本加载失败，请下载后查看。</div>';
        });
      } else {
        bodyEl.innerHTML = '<div class="preview-unsupported">该文件类型不支持在线预览，请下载后查看。</div>';
      }
      document.getElementById('preview-modal').classList.add('active');
    }

    function closePreview() {
      const m = document.getElementById('preview-modal');
      if (!m.classList.contains('active')) return;
      m.classList.remove('active');
      document.getElementById('preview-body').innerHTML = '';
    }

    // ── Markdown 渲染（markdown-it 解析 + DOMPurify 防 XSS） ─────
    let mdCurrentText = '';
    let mdCurrentMode = 'render';

    function renderMarkdown(text, mode) {
      mdCurrentText = text;
      mdCurrentMode = mode || 'render';
      const bodyEl = document.getElementById('preview-body');
      const toggleBtn = document.getElementById('preview-md-toggle');
      bodyEl.classList.add('is-md');
      if (mdCurrentMode === 'source') {
        const pre = document.createElement('pre');
        pre.className = 'preview-text';
        pre.textContent = text.length > 200000
          ? text.slice(0, 200000) + '\n\n…（内容过大，仅显示前 200000 字符）'
          : text;
        bodyEl.innerHTML = '';
        bodyEl.appendChild(pre);
        toggleBtn.textContent = '查看渲染';
      } else {
        let html = window.markdownit
          ? window.markdownit({ html: false, linkify: true, breaks: false }).render(text)
          : escapeHtml(text);
        if (window.DOMPurify) html = window.DOMPurify.sanitize(html);
        const div = document.createElement('div');
        div.className = 'markdown-body';
        div.innerHTML = html;
        bodyEl.innerHTML = '';
        bodyEl.appendChild(div);
        toggleBtn.textContent = '查看源码';
      }
    }

    function toggleMarkdownView() {
      renderMarkdown(mdCurrentText, mdCurrentMode === 'render' ? 'source' : 'render');
    }

    // ── 主题 ────────────────────────────────────────────────
    function applyTheme(theme) {
      const root = document.documentElement;
      if (theme === 'dark') root.classList.add('dark');
      else root.classList.remove('dark');
      try { localStorage.setItem('theme', theme); } catch (e) {}
      const btn = document.getElementById('theme-toggle');
      if (btn) btn.setAttribute('aria-pressed', theme === 'dark');
    }
    function toggleTheme() {
      const isDark = document.documentElement.classList.contains('dark');
      applyTheme(isDark ? 'light' : 'dark');
    }

    // ── 当前文件夹信息（直接取 /api/files 返回的字段） ────────
    function updateCurrentFolderDisplay(data) {
      const nameEl = document.getElementById('current-folder-name');
      const descEl = document.getElementById('folder-description-text');
      nameEl.textContent = data.folderName || '未选择';
      descEl.textContent = data.folderDescription || '';
    }

    // ── 提示条 ──────────────────────────────────────────────
    let toastTimer = null;
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const icon = type === 'error'
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
      toast.className = 'toast toast-' + type;
      toast.innerHTML = icon + '<span>' + escapeHtml(message) + '</span>';
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // ── 复制文本（兼容非安全上下文 http://IP） ───────────────
    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise((resolve, reject) => {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.top = '-1000px';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          ok ? resolve() : reject(new Error('execCommand failed'));
        } catch (e) { reject(e); }
      });
    }

    // 复制按钮内联成功反馈（绿色 + 文案切换，2 秒后恢复）
    function flashCopied(btn) {
      if (!btn || !btn.classList) return;
      const original = btn.innerHTML;
      btn.classList.add('copied');
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> 已复制';
      clearTimeout(btn._copyTimer);
      btn._copyTimer = setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = original;
      }, 2000);
    }

    // ── 文件加载 ────────────────────────────────────────────
    async function loadFiles(folderIndex = 0, path = '') {
      currentFolderIndex = folderIndex;
      currentPath = path;
      searchQuery = '';
      const searchInput = document.getElementById('file-search');
      if (searchInput) searchInput.value = '';

      const fileListDiv = document.getElementById('file-list');
      fileListDiv.innerHTML = '<div class="loading">加载中…</div>';

      const url = `/api/files?folderIndex=${folderIndex}&path=${encodeURIComponent(path)}`;
      try {
        const response = await fetch(url);
        const data = await response.json();
        if (data.error) {
          fileListDiv.innerHTML = `<div class="error">${escapeHtml(data.error || '加载失败')}</div>`;
          return;
        }
        currentData = data;
        updateCurrentFolderDisplay(data);
        renderFileList(data);
      } catch (error) {
        fileListDiv.innerHTML = '<div class="error">网络错误，请检查服务器连接</div>';
      }
    }

    // ── 面包屑 ──────────────────────────────────────────────
    function renderBreadcrumb() {
      const breadcrumbDiv = document.getElementById('breadcrumb');
      const segments = currentPath ? currentPath.split('/').filter(s => s.length > 0) : [];
      let html = `<a href="#" data-action="navigate" data-folder-index="${currentFolderIndex}" data-path=""><svg class="home-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>根目录</a>`;
      let accumulated = '';
      segments.forEach((seg, i) => {
        accumulated += (accumulated ? '/' : '') + seg;
        if (i === segments.length - 1) {
          html += `<span class="sep">/</span><span class="current">${escapeHtml(seg)}</span>`;
        } else {
          html += `<span class="sep">/</span><a href="#" data-action="navigate" data-folder-index="${currentFolderIndex}" data-path="${escapeHtml(accumulated)}">${escapeHtml(seg)}</a>`;
        }
      });
      breadcrumbDiv.innerHTML = html;
    }

    // ── 文件列表 ────────────────────────────────────────────
    function renderFileList(data) {
      const fileListDiv = document.getElementById('file-list');
      renderBreadcrumb();

      let folders = data.folders || [];
      let files = data.files || [];
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        folders = folders.filter(f => f.name.toLowerCase().includes(q));
        files = files.filter(f => f.name.toLowerCase().includes(q));
      }

      if (folders.length === 0 && files.length === 0) {
        const msg = searchQuery ? '未找到匹配的文件' : '此文件夹为空';
        fileListDiv.innerHTML = `<div class="empty">${msg}</div>`;
        return;
      }

      let html = '';

      // 返回上级（非根目录且未搜索时显示）
      if (currentPath && !searchQuery) {
        html += `
          <div class="file-item file-item-clickable" data-action="navigate-up">
            <div class="file-icon folder-icon-color">${SVGIcons.back}</div>
            <div class="file-info">
              <div class="file-name">返回上级</div>
              <div class="file-meta"></div>
            </div>
            <div class="file-size"></div>
            <div class="file-modified"></div>
            <div class="file-actions"></div>
          </div>`;
      }

      // 文件夹
      folders.forEach(folder => {
        html += `
          <div class="file-item file-item-clickable" data-action="navigate" data-folder-index="${currentFolderIndex}" data-path="${escapeHtml(currentPath ? currentPath + '/' + folder.name : folder.name)}">
            <div class="file-icon folder-icon-color">${SVGIcons.folder}</div>
            <div class="file-info">
              <div class="file-name">${escapeHtml(folder.name)}</div>
              <div class="file-meta"><span class="tag tag-secondary">文件夹</span></div>
            </div>
            <div class="file-size"></div>
            <div class="file-modified">${escapeHtml(folder.modified)}</div>
            <div class="file-actions"></div>
          </div>`;
      });

      // 文件
      files.forEach(file => {
        const tag = getTypeTag(file);
        const urlPath = (file.path || file.name).replace(/\\/g, '/').split('/').map(encodeURIComponent).join('/');
        const downloadUrl = `${window.location.origin}/d/${currentFolderIndex}/${urlPath}`;
        const previewBtn = canPreview(file.type, file.name)
          ? `<button class="btn btn-secondary btn-sm" data-action="preview" data-folder-index="${currentFolderIndex}" data-path="${escapeHtml(urlPath)}" data-type="${escapeHtml(file.type || '')}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                预览
              </button>`
          : '';
        html += `
          <div class="file-item">
            <div class="file-icon">${getFileIcon(file)}</div>
            <div class="file-info">
              <div class="file-name">${escapeHtml(file.name)}</div>
              <div class="file-meta"><span class="tag ${tag.cls}">${tag.label}</span></div>
            </div>
            <div class="file-size">${escapeHtml(file.size)}</div>
            <div class="file-modified">${escapeHtml(file.modified)}</div>
            <div class="file-actions">
              <button class="btn btn-ghost btn-sm" data-action="copy-link" data-folder-index="${currentFolderIndex}" data-path="${escapeHtml(file.path || file.name)}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                链接
              </button>
              ${previewBtn}
              <button class="btn btn-primary btn-sm" data-action="download" data-download-url="${escapeHtml(downloadUrl)}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                下载
              </button>
            </div>
          </div>`;
      });

      fileListDiv.innerHTML = html;
    }

    function navigateUp() {
      if (!currentPath) return;
      const parts = currentPath.split('/').filter(p => p.length > 0);
      parts.pop();
      loadFiles(currentFolderIndex, parts.join('/'));
    }

    function filterFiles() {
      const input = document.getElementById('file-search');
      searchQuery = input.value.trim();
      if (currentData) renderFileList(currentData);
    }

    // ── 事件委派（data-* 属性替代 onclick，杜绝用户数据注入 JS 上下文导致 XSS） ──
    function handleDelegatedClick(e) {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      if (target.tagName === 'A') e.preventDefault();

      const action = target.dataset.action;
      const idx = parseInt(target.dataset.folderIndex, 10);

      switch (action) {
        case 'navigate':
          loadFiles(idx, target.dataset.path || '');
          break;
        case 'navigate-up':
          navigateUp();
          break;
        case 'preview':
          openPreview(idx, target.dataset.path, target.dataset.type);
          break;
        case 'download':
          window.open(target.dataset.downloadUrl);
          break;
        case 'copy-link':
          e.stopPropagation();
          doCopyLink(target, idx, target.dataset.path);
          break;
      }
    }

    function doCopyLink(btn, folderIndex, filePath) {
      const link = `${window.location.origin}/d/${folderIndex}/${filePath}`;
      copyText(link).then(() => {
        showToast('下载链接已复制', 'success');
        flashCopied(btn);
      }).catch(() => {
        showToast('复制失败，请手动复制：' + link, 'error');
      });
    }

    // ── 事件绑定与初始化 ────────────────────────────────────
    document.getElementById('switch-folder-btn').addEventListener('click', openFolderModal);
    document.getElementById('folder-modal-close').addEventListener('click', closeFolderModalBtn);
    document.getElementById('folder-modal').addEventListener('click', closeFolderModal);
    document.getElementById('preview-modal-close').addEventListener('click', closePreview);
    document.getElementById('preview-md-toggle').addEventListener('click', toggleMarkdownView);
    document.getElementById('preview-modal').addEventListener('click', (e) => {
      if (e.target.id === 'preview-modal') closePreview();
    });
    document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
    document.getElementById('file-search').addEventListener('input', filterFiles);
    document.getElementById('file-list').addEventListener('click', handleDelegatedClick);
    document.getElementById('breadcrumb').addEventListener('click', handleDelegatedClick);

    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeFolderModalBtn(); closePreview(); }
    });

    window.onload = function () {
      applyTheme(document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      loadFolders().then(() => loadFiles());
    };
  </script>
</body>
</html>
