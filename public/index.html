<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>局域网文件分享</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background-color: #f5f5f5;
      min-height: 100vh;
      padding: 0;
      color: #1a1a1a;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0;
    }

    .header {
      background: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      padding: 24px 40px;
      margin-bottom: 0;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      color: #1a1a1a;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo {
      width: 32px;
      height: 32px;
    }

    .header p {
      color: #666;
      font-size: 14px;
      margin-top: 4px;
    }

    .main-content {
      padding: 0;
    }

    .toolbar {
      background: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 40px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .current-folder-name {
      font-size: 13px;
      color: #666;
      font-weight: 500;
    }

    .folder-description {
      font-size: 13px;
      color: #666;
      margin-left: 12px;
    }

    .btn-folder-small {
      padding: 4px 8px;
      background: #ffffff;
      border: 1px solid #d0d0d0;
      font-size: 12px;
      color: #666;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      margin-right: 8px;
    }

    .btn-folder-small:hover {
      background: #f5f5f5;
      border-color: #1a1a1a;
      color: #1a1a1a;
    }

    .btn-folder-small svg {
      width: 14px;
      height: 14px;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      min-width: 400px;
      max-width: 600px;
      max-height: 80vh;
      overflow: hidden;
    }

    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
      margin: 0;
    }

    .modal-close {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      transition: color 0.2s;
    }

    .modal-close:hover {
      color: #1a1a1a;
    }

    .modal-close svg {
      width: 20px;
      height: 20px;
    }

    .modal-body {
      padding: 20px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .folder-option {
      padding: 12px 16px;
      border: 1px solid #e0e0e0;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .folder-option:hover {
      background: #f5f5f5;
      border-color: #1a1a1a;
    }

    .folder-option.active {
      background: #1a1a1a;
      border-color: #1a1a1a;
      color: #ffffff;
    }

    .folder-option-name {
      font-weight: 500;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .folder-option-desc {
      font-size: 12px;
      opacity: 0.7;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #1a1a1a;
      color: #ffffff;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 2000;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .toast-success {
      background: #1a1a1a;
    }

    .toast-error {
      background: #c53030;
    }

    .breadcrumb {
      background: #ffffff;
      border-bottom: 1px solid #e0e0e0;
      padding: 12px 40px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
    }

    .breadcrumb a {
      color: #0066cc;
      text-decoration: none;
      padding: 4px 8px;
      transition: background 0.2s;
    }

    .breadcrumb a:hover {
      background: #f0f0f0;
    }

    .breadcrumb span {
      color: #999;
    }

    .breadcrumb .current {
      color: #1a1a1a;
      font-weight: 500;
    }

    .file-panel {
      background: #ffffff;
      min-height: calc(100vh - 200px);
    }

    .file-header {
      display: flex;
      padding: 16px 24px;
      border-bottom: 1px solid #e0e0e0;
      background: #fafafa;
      font-size: 13px;
      font-weight: 500;
      color: #666;
    }

    .file-header-column {
      flex: 1;
      padding: 0 12px;
    }

    .file-header-column:first-child {
      flex: 2;
    }

    .file-list {
      display: flex;
      flex-direction: column;
    }

    .file-item {
      display: flex;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
      cursor: pointer;
    }

    .file-item:hover {
      background: #f8f8f8;
    }

    .file-item:last-child {
      border-bottom: none;
    }

    .file-item-clickable:hover {
      background: #f0f7ff;
    }

    .file-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 16px;
      flex-shrink: 0;
    }

    .file-icon svg {
      width: 32px;
      height: 32px;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 4px;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-size: 12px;
      color: #999;
    }

    .file-size {
      flex: 0 0 120px;
      padding: 0 12px;
      font-size: 13px;
      color: #666;
    }

    .file-modified {
      flex: 0 0 180px;
      padding: 0 12px;
      font-size: 13px;
      color: #666;
    }

    .file-actions {
      flex: 0 0 200px;
      padding: 0 12px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn {
      padding: 8px 16px;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-primary {
      background: #1a1a1a;
      color: #ffffff;
      border-color: #1a1a1a;
    }

    .btn-primary:hover {
      background: #333333;
      border-color: #333333;
    }

    .btn-secondary {
      background: #ffffff;
      color: #1a1a1a;
      border-color: #d0d0d0;
    }

    .btn-secondary:hover {
      background: #f5f5f5;
      border-color: #b0b0b0;
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #999;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #999;
      font-size: 14px;
    }

    .error {
      background: #fff5f5;
      color: #c53030;
      padding: 16px 24px;
      border: 1px solid #feb2b2;
      margin: 24px;
      font-size: 14px;
    }

    .folder-icon-color {
      color: #d4a017;
    }

    @media (max-width: 768px) {
      .header {
        padding: 20px 24px;
      }

      .toolbar {
        padding: 12px 24px;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .btn-folder-small {
        width: 28px;
        height: 28px;
      }

      .current-folder-name {
        margin-top: 0;
      }

      .folder-description {
        margin-left: 12px;
        margin-top: 0;
      }

      .breadcrumb {
        padding: 12px 24px;
      }

      .modal {
        min-width: calc(100% - 40px);
        margin: 20px;
      }

      .file-header {
        display: none;
      }

      .file-item {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .file-icon {
        margin-right: 0;
      }

      .file-size,
      .file-modified {
        flex: auto;
        padding: 0;
      }

      .file-actions {
        flex: auto;
        padding: 0;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="toast" id="toast">
      <span id="toast-icon"></span>
      <span id="toast-message"></span>
    </div>

    <div class="header">
      <div class="header-content">
        <div>
          <h1>
            <svg class="header-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            局域网文件分享
          </h1>
          <p id="folder-description">快速、便捷的文件共享服务</p>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <button class="btn-folder-small" onclick="openFolderModal()" title="切换文件夹">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
      </button>
      <span class="current-folder-name" id="current-folder-name">未选择</span>
      <span class="folder-description" id="folder-description-text"></span>
    </div>

    <div class="breadcrumb" id="breadcrumb">
    </div>

    <div class="modal-overlay" id="folder-modal" onclick="closeFolderModal(event)">
      <div class="modal">
        <div class="modal-header">
          <h3>选择分享文件夹</h3>
          <button class="modal-close" onclick="closeFolderModalBtn()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
        <div class="modal-body" id="folder-modal-body">
        </div>
      </div>
    </div>

    <div class="file-panel">
      <div class="file-header">
        <div class="file-header-column" style="flex: 2;">名称</div>
        <div class="file-header-column" style="flex: 0 0 120px;">大小</div>
        <div class="file-header-column" style="flex: 0 0 180px;">修改时间</div>
        <div class="file-header-column" style="flex: 0 0 200px; text-align: right;">操作</div>
      </div>
      <div class="file-list" id="file-list">
        <div class="loading">加载中...</div>
      </div>
    </div>
  </div>

  <script>
    let currentFolderIndex = 0;
    let currentPath = '';
    let folders = [];

    const SVGIcons = {
      folder: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
      </svg>`,
      
      folderUp: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        <path d="M12 11V17M12 17L9 14M12 17L15 14"/>
      </svg>`,
      
      file: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
        <path d="M13 2v7h7"/>
      </svg>`,
      
      image: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="0" ry="0"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>`,
      
      video: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <polygon points="23 7 16 12 23 17 23 7"/>
        <rect x="1" y="5" width="15" height="14" rx="0" ry="0"/>
      </svg>`,
      
      audio: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 18V5l12-2v13"/>
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="16" r="3"/>
      </svg>`,
      
      pdf: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
      </svg>`,
      
      archive: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M21 8v13H3V8"/>
        <path d="M1 3h22v5H1z"/>
        <path d="M10 12h4"/>
      </svg>`,
      
      document: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
      </svg>`,
      
      spreadsheet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <path d="M14 2v6h6M14 10H6M6 14h12M6 18h12"/>
      </svg>`,
      
      presentation: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <path d="M14 2v6h6M12 18v-6M9 15l3-3 3 3"/>
      </svg>`,
      
      code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>
      </svg>`,
      
      download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <path d="M7 10l5 5 5-5"/>
        <path d="M12 15V3"/>
      </svg>`,
      
      eye: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>`,
      
      link: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>`,
      
      check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20 6 9 17 4 12"/>
      </svg>`,
      
      error: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>`
    };

    function getFileIcon(mimeType, fileName) {
      const ext = fileName.split('.').pop().toLowerCase();
      
      if (mimeType.startsWith('image/')) return SVGIcons.image;
      if (mimeType.startsWith('video/')) return SVGIcons.video;
      if (mimeType.startsWith('audio/')) return SVGIcons.audio;
      if (mimeType === 'application/pdf') return SVGIcons.pdf;
      if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return SVGIcons.archive;
      if (['doc', 'docx'].includes(ext)) return SVGIcons.document;
      if (['xls', 'xlsx'].includes(ext)) return SVGIcons.spreadsheet;
      if (['ppt', 'pptx'].includes(ext)) return SVGIcons.presentation;
      if (['js', 'ts', 'py', 'java', 'cpp', 'c', 'html', 'css', 'json'].includes(ext)) return SVGIcons.code;
      
      return SVGIcons.file;
    }

    async function loadFolders() {
      try {
        const response = await fetch('/api/folders');
        folders = await response.json();
        
        const modalBody = document.getElementById('folder-modal-body');
        modalBody.innerHTML = '';
        
        folders.forEach((folder, index) => {
          const option = document.createElement('div');
          option.className = 'folder-option';
          option.onclick = () => selectFolder(index);
          option.innerHTML = `
            <div class="folder-option-name">${folder.name}</div>
            <div class="folder-option-desc">${folder.description || ''}</div>
          `;
          if (index === currentFolderIndex) {
            option.classList.add('active');
          }
          modalBody.appendChild(option);
        });
        
        if (folders.length > 0) {
          updateCurrentFolderDisplay(currentFolderIndex);
        }
      } catch (error) {
        console.error('加载文件夹列表失败:', error);
      }
    }

    function openFolderModal() {
      document.getElementById('folder-modal').classList.add('active');
    }

    function closeFolderModal(event) {
      if (event.target.id === 'folder-modal') {
        document.getElementById('folder-modal').classList.remove('active');
      }
    }

    function closeFolderModalBtn() {
      document.getElementById('folder-modal').classList.remove('active');
    }

    function selectFolder(index) {
      currentFolderIndex = index;
      currentPath = '';
      
      const options = document.querySelectorAll('.folder-option');
      options.forEach((opt, i) => {
        opt.classList.toggle('active', i === index);
      });
      
      updateCurrentFolderDisplay(index);
      closeFolderModalBtn();
      loadFiles(index, '');
    }

    function updateCurrentFolderDisplay(index) {
      if (folders[index]) {
        document.getElementById('current-folder-name').textContent = folders[index].name;
        document.getElementById('folder-description-text').textContent = folders[index].description || '';
      }
    }

    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastIcon = document.getElementById('toast-icon');
      const toastMessage = document.getElementById('toast-message');
      
      toastIcon.innerHTML = type === 'success' ? SVGIcons.check : SVGIcons.error;
      toastMessage.textContent = message;
      
      toast.className = `toast toast-${type}`;
      
      setTimeout(() => {
        toast.classList.add('show');
      }, 10);
      
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    function copyFileLink(event, encodedPath) {
      event.stopPropagation();
      event.preventDefault();
      
      const btn = event.currentTarget;
      const downloadUrl = btn.getAttribute('data-url');
      
      if (!downloadUrl) {
        showToast('链接无效', 'error');
        return;
      }
      
      // 使用 Clipboard API 或备用方案
      const copyToClipboard = () => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(downloadUrl);
        } else {
          // 备用方案
          return Promise.reject(new Error('Clipboard API 不可用'));
        }
      };
      
      copyToClipboard().then(() => {
        btn.innerHTML = `
          ${SVGIcons.check}
          已复制
        `;
        showToast('链接已复制', 'success');
        setTimeout(() => {
          btn.innerHTML = `
            ${SVGIcons.link}
            链接
          `;
        }, 2000);
      }).catch(err => {
        console.error('复制失败:', err);
        // 备用方案：使用 textarea
        const textArea = document.createElement('textarea');
        textArea.value = downloadUrl;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToast('链接已复制', 'success');
        } catch (execErr) {
          console.error('备用方案也失败:', execErr);
          showToast('复制失败，请手动复制', 'error');
        }
        document.body.removeChild(textArea);
      });
    }

    async function loadFiles(folderIndex = 0, path = '') {
      currentFolderIndex = folderIndex;
      currentPath = path;
      
      const fileListDiv = document.getElementById('file-list');
      fileListDiv.innerHTML = '<div class="loading">加载中...</div>';
      
      try {
        const response = await fetch(`/api/files?folderIndex=${folderIndex}&path=${encodeURIComponent(path)}`);
        const data = await response.json();
        
        if (data.error) {
          fileListDiv.innerHTML = `<div class="error">错误：${data.error}</div>`;
          return;
        }
        
        document.getElementById('folder-description').textContent = data.folderDescription || '快速、便捷的文件共享服务';
        updateCurrentFolderDisplay(folderIndex);
        
        renderBreadcrumb(data.currentPath);
        renderFileList(data);
      } catch (error) {
        console.error('加载文件列表失败:', error);
        fileListDiv.innerHTML = '<div class="error">加载失败，请刷新页面重试</div>';
      }
    }

    function renderBreadcrumb(currentPath) {
      const breadcrumbDiv = document.getElementById('breadcrumb');
      const parts = currentPath.split('\\').join('/').split('/').filter(p => p);
      
      let html = `
        <svg style="width: 16px; height: 16px; vertical-align: middle;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <a href="#" onclick="loadFiles(${currentFolderIndex}, ''); return false;">首页</a>
      `;
      
      let accumulatedPath = '';
      parts.forEach((part, index) => {
        accumulatedPath += (accumulatedPath ? '/' : '') + part;
        if (index === parts.length - 1) {
          html += `<span>/</span><span class="current">${part}</span>`;
        } else {
          html += ` <span>/</span> <a href="#" onclick="loadFiles(${currentFolderIndex}, '${accumulatedPath}'); return false;">${part}</a>`;
        }
      });
      
      breadcrumbDiv.innerHTML = html;
    }

    function renderFileList(data) {
      const fileListDiv = document.getElementById('file-list');
      
      if (data.folders.length === 0 && data.files.length === 0) {
        fileListDiv.innerHTML = '<div class="empty">此文件夹为空</div>';
        return;
      }
      
      let html = '';
      
      if (data.currentPath) {
        html += `
          <div class="file-item file-item-clickable" onclick="navigateUp()">
            <div class="file-icon folder-icon-color">
              ${SVGIcons.folderUp}
            </div>
            <div class="file-info">
              <div class="file-name">返回上级</div>
            </div>
            <div class="file-size"></div>
            <div class="file-modified"></div>
            <div class="file-actions"></div>
          </div>
        `;
      }
      
      data.folders.forEach(folder => {
        html += `
          <div class="file-item file-item-clickable" onclick="loadFiles(${data.folderIndex}, '${folder.path.replace(/\\/g, '\\\\')}')">
            <div class="file-icon folder-icon-color">
              ${SVGIcons.folder}
            </div>
            <div class="file-info">
              <div class="file-name">${folder.name}</div>
              <div class="file-meta">修改时间：${folder.modified}</div>
            </div>
            <div class="file-size"></div>
            <div class="file-modified">${folder.modified}</div>
            <div class="file-actions"></div>
          </div>
        `;
      });
      
      data.files.forEach(file => {
        const icon = getFileIcon(file.type, file.name);
        const canPreview = file.type.startsWith('image/') || file.type === 'application/pdf';
        const encodedPath = encodeURIComponent(file.path);
        const downloadUrl = `${window.location.origin}/api/download?folderIndex=${data.folderIndex}&path=${encodedPath}`;
        
        html += `
          <div class="file-item">
            <div class="file-icon">
              ${icon}
            </div>
            <div class="file-info">
              <div class="file-name">${file.name}</div>
              <div class="file-meta">类型：${file.type}</div>
            </div>
            <div class="file-size">${file.size}</div>
            <div class="file-modified">${file.modified}</div>
            <div class="file-actions">
              <button class="btn btn-secondary" onclick="copyFileLink(event, decodeURIComponent('${encodedPath}'))" data-url="${downloadUrl}" title="复制下载链接">
                ${SVGIcons.link}
                链接
              </button>
              ${canPreview ? `
                <a href="/api/preview?folderIndex=${data.folderIndex}&path=${encodedPath}" target="_blank" class="btn btn-secondary">
                  ${SVGIcons.eye}
                  预览
                </a>
              ` : ''}
              <a href="/api/download?folderIndex=${data.folderIndex}&path=${encodedPath}" class="btn btn-primary">
                ${SVGIcons.download}
                下载
              </a>
            </div>
          </div>
        `;
      });
      
      fileListDiv.innerHTML = html;
    }

    function navigateUp() {
      const parts = currentPath.split('\\').join('/').split('/').filter(p => p);
      if (parts.length > 0) {
        parts.pop();
        const parentPath = parts.join('/');
        loadFiles(currentFolderIndex, parentPath);
      } else {
        loadFiles(currentFolderIndex, '');
      }
    }

    window.onload = function() {
      loadFolders().then(() => {
        loadFiles();
      });
    };
  </script>
</body>
</html>
